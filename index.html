<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Thammu!!!</title>
    <style>
        h1 {
            font-size: 50px;
        }

        body {
            background-color: rgb(100, 200, 255);
            color: red;
            font-size: 20px;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <h1>Happy Birthday 13<sup>th</sup> Thammu!!!</h1>
    13 is the 6<sup>th</sup> prime number<br>
    13 is the 8<sup>th</sup> number in the Fibonacci Sequence<br><br>
    <script src="https://cdn.jsdelivr.net/npm/p5@1.7.0/lib/p5.js"></script>
    <script>

        let objects = [];
        let objects2 = [];

        function setup() {
            createCanvas(500, 500)

            objects.push({ pos: createVector(200, 200), vel: createVector(1, 0.5) })

            for (let i = 0; i < 20; i++) {
                objects.push({ pos: createVector(Math.random() * (width - 20) + 10, Math.random() * (width - 20) + 10), vel: createVector(Math.random() * 4 - 2, Math.random() * 4 - 2) })
            }

            objects2 = [...objects]
        }

        function draw() {
            background(0)

            for (i = 0; i < objects.length; i++) {
                o = objects[i];

                fill(150);
                ellipse(o.pos.x, o.pos.y, 20, 20);

                for (o2 of objects) {
                    if (o != o2) {
                        if (o.pos.dist(o2.pos) < 20) {
                            console.log("collision")

                            let impact = p5.Vector.sub(o2.pos, o.pos);
                            let vDiff = p5.Vector.sub(o2.vel, o.vel);

                            let dv = impact.copy();
                            let den = Math.pow(o.pos.dist(o2.pos),2)
                            dv.mult(vDiff.dot(impact)/den)

                            objects2[i].vel.add(dv)
                        }
                    }
                }


            }
            objects = [...objects2]

            for (o of objects) {
                o.pos.add(o.vel);

                //bounce off walls
                if (o.pos.x > width - 10) {
                    o.pos.x = width - 10;
                    o.vel.x *= -1;
                } else if (o.pos.x < 10) {
                    o.pos.x = 10;
                    o.vel.x *= -1;
                }

                if (o.pos.y > height - 10) {
                    o.pos.y = height - 10;
                    o.vel.y *= -1;
                } else if (o.pos.y < 10) {
                    o.pos.y = 10;
                    o.vel.y *= -1;
                }
            }
            objects2 = [...objects]

        }



    </script>
</body>

</html>
